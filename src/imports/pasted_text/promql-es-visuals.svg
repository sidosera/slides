Design a complete set of technical visualizations for an Elastic engineering blog post about implementing PromQL natively in Elasticsearch.

The audience is senior/staff engineers working on databases, distributed systems, query engines, observability, and metrics. The visuals should feel like engineering diagrams from a technical design doc that have been polished for publication — not marketing illustrations.

SOURCE / BRAND REFERENCE

Use the Elastic Brand Guidelines already available in this Figma file.

The blog has a WHITE theme.

Use:
- White as the main canvas/background.
- Ink / Dark Ink for primary text and structural lines.
- Light Grey / Medium Grey for secondary containers, boundaries, inactive paths, grids.
- Elastic Blue as the primary technical/accent color.
- Teal, Poppy, Pink, Yellow, Light Blue / Sky Blue as secondary semantic colors.
- Darker variants only where additional contrast or hierarchy is required.

Do NOT invent a new color palette. Use existing Elastic Figma color styles/tokens.

The diagrams should remain highly readable when embedded in a white blog page at roughly 700–1000 px width.

GENERAL VISUAL LANGUAGE

Create one shared visual system and reuse it across every figure.

Style:
- minimalist
- technical
- flat
- precise
- architectural
- lots of white space
- thin lines
- restrained use of color
- no gradients unless an existing Elastic brand style explicitly calls for them
- no 3D
- no isometric servers
- no cloud clip-art
- no generic “AI” graphics
- no decorative blobs
- no fake dashboards
- no unnecessary icons

Think:
query planner diagram + compiler diagram + distributed systems paper + Elastic brand.

Boxes:
- subtle 1 px borders
- small radius, approximately 6–8 px
- mostly white fill
- selected/highlighted operators may use a very light tint of their semantic color

Typography:
- use Elastic's existing typography styles
- titles short and strong
- labels small but readable
- code/query text in an appropriate monospace style
- avoid paragraph-sized text inside diagrams

Arrows:
- simple directional arrows
- use line thickness and color sparingly to indicate important data flow
- distinguish logical-plan transformations from physical/network movement where useful

CONSISTENCY

Create reusable Figma components for:
- query/operator node
- plan node
- API endpoint
- time-series block
- cluster/data node
- coordinator
- arrow / exchange
- label set
- code/query chip
- annotation / callout
- unsupported/future feature marker

Every figure should look like part of the same article.

Do not put a huge title inside each diagram. Each visual should have a small figure title/subtitle that can optionally be removed when the image is embedded below an article heading.

Create all diagrams as vector layers, fully editable.

==================================================
FIGURE 1 — HERO / ARTICLE COVER
==================================================

Concept: “PromQL becomes a frontend to Elasticsearch.”

This should be the cover image for the article.

Show a PromQL query entering from the left:

rate(http_requests_total[5m])

Then visually move through:

PromQL
→ parser / planner
→ Elasticsearch distributed compute engine
→ time-series data

The strongest visual idea should be that PromQL is NOT a separate engine bolted onto Elasticsearch. It becomes another language frontend over the same execution machinery.

Optionally show ES|QL joining from another branch into the same execution engine:

        ES|QL
           \
            → Elasticsearch compute engine
           /
      PromQL

Keep it abstract and elegant rather than detailed.

Use Elastic Blue for the main execution path, with perhaps Teal for PromQL and a secondary Elastic color for ES|QL.

Landscape approximately 1600×900.

==================================================
FIGURE 2 — PROMQL COMPILATION / EXECUTION PIPELINE
==================================================

A clean compiler-style vertical or horizontal architecture diagram:

Prometheus HTTP API
        ↓
     PromQL
        ↓
   Parser / AST
        ↓
PromQL logical plan
        ↓
Lowering + optimization
        ↓
Elasticsearch physical plan
        ↓
Distributed compute
        ↓
Prometheus response adapter

Visually distinguish:

LANGUAGE / SEMANTICS
from
SHARED ELASTICSEARCH ENGINE

For example, place the upper PromQL-specific nodes inside a subtle Teal-tinted boundary and the lower shared engine nodes inside a subtle Elastic Blue boundary.

The important conceptual message:
PromQL keeps Prometheus semantics through planning, then progressively lowers into shared Elasticsearch machinery.

==================================================
FIGURE 3 — WHY RATE() IS NOT JUST AN AGGREGATION
==================================================

Visualize this query:

sum by (service) (
  rate(http_requests_total[5m])
)

Compare a naive relational interpretation with the actual time-series execution.

LEFT, small / de-emphasized:

scan
→ group
→ aggregate

Mark this as incorrect / insufficient.

RIGHT, main diagram:

scan samples
→ partition by time series
→ construct 5m windows
→ order samples by timestamp
→ detect counter resets
→ compute rate per series
→ align evaluation timestamps
→ aggregate by service

Show 2–3 tiny input series with sample dots, including one counter reset.

Make the reset visually obvious:
e.g. 95 → 103 → 4 → 11

Then show how rate operates before cross-series aggregation.

This should communicate why PromQL requires time-series-specific execution semantics.

==================================================
FIGURE 4 — QUERY_RANGE AND TIMESERIES COLLAPSE
==================================================

Title concept:
“One series, many execution rows”

Show the mismatch between Elasticsearch execution output and Prometheus query_range output.

LEFT:
Compute-engine rows

series_a | 10:00 | 42
series_a | 10:01 | 43
series_a | 10:02 | 41
series_b | 10:00 | 12
series_b | 10:01 | 14

CENTER:
TimeSeriesCollapse operator

RIGHT:
Prometheus matrix representation

series_a
[(10:00,42), (10:01,43), (10:02,41)]

series_b
[(10:00,12), (10:01,14)]

Represent each series consistently with a different Elastic secondary color.

Make TimeSeriesCollapse look like a real execution-engine operator, not a magical transformation.

Add a small annotation:
“collapse values onto the requested evaluation-step grid”

The core point:
API semantics exposed a missing execution primitive, so the primitive was added to the shared compute engine.

==================================================
FIGURE 5 — BINARY PROMQL EXPRESSIONS ARE JOINS
==================================================

Use:

rate(http_errors_total[5m])
/
rate(http_requests_total[5m])

Architecture:

                    /
              binary '/'
              /        \
             /          \
    errors branch     requests branch
         |                 |
       rate()             rate()
         |                 |
   series set A       series set B
             \          /
              \        /
             SERIES MATCH
                  |
              arithmetic
                  |
              result series

Make SERIES MATCH visually look closer to a distributed hash join than scalar arithmetic.

Below it, show example labels:

LEFT:
{cluster="a", instance="1"}
{cluster="a", instance="2"}
{cluster="b", instance="1"}

RIGHT:
{cluster="a"}
{cluster="b"}

Then show the effect of:

on(cluster)
group_left

Do not try to explain every PromQL matching rule. The diagram should communicate that matching keys + cardinality are part of binary-expression semantics.

==================================================
FIGURE 6 — SELECTOR LOCALITY / OPTIMIZER BUG
==================================================

This should feel like an engineering debugging diagram.

Query:

sum by (cluster) (errors{service="foo"})
/
sum by (cluster) (requests{service="bar"})

Show WRONG lowering:

             global filter
 service="foo" AND service="bar"
                  |
              EmptyRelation

Make this side grey / Poppy-accented.

Then show CORRECT lowering:

             binary /
             /      \
            /        \
service="foo"      service="bar"
     |                  |
 errors branch      requests branch

Each selector remains attached to its operand.

Add short annotation:

“PromQL operands are independent expressions.
Selector predicates must remain branch-local.”

This is a good figure to make the blog feel like an engineering story rather than a product announcement.

