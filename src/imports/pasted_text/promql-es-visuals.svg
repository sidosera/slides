==================================================
FIGURE 9 — NATIVE HISTOGRAM LOWERING
==================================================

Show that classic and native histograms require different execution shapes.

TOP / CLASSIC HISTOGRAM:

bucket series:
le="0.1"
le="0.5"
le="1"
le="+Inf"

        ↓

histogram_quantile()

        ↓

quantile value

BOTTOM / NATIVE / EXPONENTIAL HISTOGRAM:

one exponential_histogram value
with bucket structure inside a single value

        ↓

PromQL histogram_quantile

        ↓

Elasticsearch histogram execution

        ↓

quantile value

Show that for native histograms, “histogram is a value,” whereas classic histograms are represented as multiple bucket series.

Add a tiny annotation:

q = 0 → min
q = 1 → max
other q → histogram percentile execution

Keep this technical, not illustrative.

==================================================
FIGURE 10 — OFFSET CHANGES SELECTOR EVALUATION
==================================================

Use:

rate(http_requests_total[5m] offset 1h)

Create a simple timeline.

Current evaluation timestamp:
T

Normal selector window:
[T - 5m, T]

With offset 1h:
[T - 1h - 5m, T - 1h]

Show the evaluation timestamp moving at the selector level.

Explicitly communicate:
“offset does not shift the final output; it shifts selector evaluation.”

Use two parallel timeline rows.

