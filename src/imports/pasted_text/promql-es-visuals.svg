FINAL QUALITY BAR

The result should look like visuals from a post written by engineers who actually built a query engine.

Avoid anything that could be mistaken for:
- a sales deck
- a product-launch infographic
- generic observability marketing
- a cloud architecture template

Favor:
- operator trees
- timelines
- execution plans
- data representation
- network boundaries
- cardinality
- transformations
- concrete PromQL examples
- subtle annotations explaining why the implementation is hard