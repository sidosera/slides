FIGURE 7 — THE PROMETHEUS COMPATIBILITY SURFACE
==================================================

Illustrate that supporting PromQL alone is not enough.

Center:
Elasticsearch Prometheus compatibility layer

Around it, show requests from Grafana / Prometheus tooling:

Query:
- /api/v1/query
- /api/v1/query_range

Discovery:
- /api/v1/labels
- /api/v1/series
- /api/v1/metadata

Capabilities:
- /api/v1/status/buildinfo

Transport:
- GET
- POST application/x-www-form-urlencoded

Ingest:
- Prometheus Remote Write

Use a radial or structured architecture layout.

Do NOT make this look like a product feature checklist.

The visual idea:
“the compatibility boundary is an ecosystem/protocol surface, not just a parser.”

